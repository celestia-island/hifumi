name: Test

# One in-flight run per ref: a superseded push cancels its
# predecessor instead of queueing behind it (farm-pressure
# relief, AGENTS ci-ops 8.3.3).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        # One full Rust test run per PR, on stable only (org-wide CI rule):
        # the self-hosted farm has 4-6 slots and PR jobs queue 38-77 minutes.
        # Nightly keeps only the static checks (clippy/fmt).
        toolchain:
          - stable

    steps:
      - uses: actions/checkout@v7

      - name: Setup toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - uses: Swatinem/rust-cache@v2

      - name: Run unit test
        run: |
          cargo test \
            --all-targets \
            --all-features \
            --workspace \
            --no-fail-fast
