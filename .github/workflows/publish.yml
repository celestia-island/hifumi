name: Publish crates.io
on:
  push:
    tags: [v*]
  workflow_dispatch:

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Release protection lives on the `release` environment; the API token is
    # still readable at repo level until the next secret rotation moves it in.
    environment: release

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-release

      - run: cargo login ${{ secrets.CRATES_IO_API_TOKEN }}
      - run: |-
          cargo release \
            publish \
            --all-features \
            --allow-branch HEAD \
            --no-confirm \
            --no-verify \
            --execute \
            -p hifumi-macros -p hifumi
