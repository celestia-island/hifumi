name: Publish crates.io
on:
  push:
    tags: [v*]
  workflow_dispatch:

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Release protection lives on the `release` environment; the API token is
    # still readable at repo level until the next secret rotation moves it in.
    environment: release

    steps:
      # Fail a manual dispatch before touching the checkout or the secret: a
      # dispatch carries no release tag, so there is no identity to publish under.
      - name: Refuse a non-tag run
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "::error::publishing requires a v* tag push; a dispatch or a non-release tag carries no release identity"
          exit 1

      # Publish the TAG's tree, never the branch's.
      #
      # The run is triggered by a tag, and on a tag push `github.sha` is already
      # the tag's commit — but the previous recipe did not pin the checkout and
      # `cargo release publish --allow-branch HEAD` published whatever `master`
      # said at push time, which is how `v0.2.1` shipped code `v0.2.0`'s tree
      # never had, and why the published version and the tagged version could
      # disagree. Pin the checkout to the tag's ref and prove the release commit
      # is the tagged commit before anything reaches crates.io: the check fails
      # the job instead of shipping a surprise tarball.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Assert the tag, the checkout and the trigger agree
        # Two compares, not one: the checkout follows `${{ github.ref }}`, so
        # HEAD *is* the tag — the first compare proves HEAD equals the tag the
        # push named (and catches a tag force-moved after the run started),
        # the second proves that HEAD is the commit GitHub says triggered this
        # run. Together: tag == HEAD == github.sha. Without the second, a
        # mismatch between the checkout and the triggering event would publish
        # a tree the event never pointed at.
        #
        # Tag names are collaborator-controlled text; pass them through `env`
        # rather than interpolating `${{ }}` into the script body.
        env:
          TAG_REF: ${{ github.ref }}
          TAG_NAME: ${{ github.ref_name }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -eu
          # `^{commit}` peels an annotated tag to its commit; lightweight tags
          # resolve to a commit already. Both tag kinds must land on the commit
          # this run checked out, otherwise the tree about to be published is
          # not the tree that was tagged.
          tag_sha=$(git rev-parse --verify "${TAG_REF}^{commit}")
          head_sha=$(git rev-parse HEAD)
          if [ "$tag_sha" != "$head_sha" ]; then
            echo "::error::tag $TAG_NAME resolves to $tag_sha, but the checked-out commit is $head_sha - refusing to publish"
            exit 1
          fi
          if [ "$head_sha" != "$TRIGGER_SHA" ]; then
            echo "::error::checked-out commit $head_sha differs from the triggering $TRIGGER_SHA - refusing to publish"
            exit 1
          fi
          echo "publishing tree of $head_sha ($TAG_NAME)"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-release

      # Build the two crates that actually ship, not `--workspace`: the e2e
      # member is `publish = false` and pulls a crates.io dependency the
      # release job has no business resolving. This repo gitignores
      # Cargo.lock, so `--locked` is unavailable and the check is not
      # byte-reproducible — it proves the tag's tree compiles, nothing more.
      - name: Build the published crates from the tag's tree
        run: cargo check --all-features -p hifumi-macros -p hifumi

      - run: cargo login ${{ secrets.CRATES_IO_API_TOKEN }}
      - run: |-
          cargo release \
            publish \
            --all-features \
            --allow-branch HEAD \
            --no-confirm \
            --no-verify \
            --execute \
            -p hifumi-macros -p hifumi
