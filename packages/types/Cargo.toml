[package]
name = "hifumi"
version.workspace = true
edition.workspace = true

publish = true
description = "A serialization library for migrating data between different versions"
license = "LicenseRef-SySL-1.0"
repository = "https://github.com/celestia-island/hifumi"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "hifumi"
path = "src/bin/hifumi/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:git2", "dep:colored", "dep:syn", "dep:quote"]

[dependencies]
_macros = { path = "../macros", version = "^0.2.0", package = "hifumi-macros" }

anyhow = { workspace = true }

serde = { workspace = true }

serde_json = { workspace = true }

clap = { version = "^4", features = ["derive"], optional = true }
git2 = { version = "^0.21", default-features = false, optional = true }
colored = { version = "^3", optional = true }
syn = { version = "^3", features = ["full", "parsing", "extra-traits"], optional = true }
quote = { version = "^1", optional = true }

[dev-dependencies]
specta = "^1.0.5"
